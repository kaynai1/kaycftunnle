name: build-fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kaycftunnle:latest .

      - name: Check lifecycle scripts
        run: bash -n packaging/fnos/build-fpk.sh packaging/fnos/cmd/install_init packaging/fnos/cmd/install_callback packaging/fnos/cmd/main

      - name: Export offline image
        run: |
          mkdir -p dist
          docker save kaycftunnle:latest -o dist/kaycftunnle-image.tar

      - name: Build online FPK
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' packaging/fnos/manifest | head -1)
          sh packaging/fnos/build-fpk.sh \
            --image "ghcr.io/kaynai1/kaycftunnle:${VERSION}" \
            --output-suffix -online \
            --platform all

      - name: Build offline FPK
        run: |
          sh packaging/fnos/build-fpk.sh \
            --tar dist/kaycftunnle-image.tar \
            --output-suffix -offline \
            --platform x86
          rm -f dist/kaycftunnle-image.tar

      - name: Generate SHA256
        run: sha256sum dist/*.fpk > dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaycftunnle-fpk
          path: |
            dist/*.fpk
            dist/SHA256SUMS

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.fpk dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
