# Kay-cftunnle 面板 · 一键部署（GHCR 预构建镜像）
# SPDX-License-Identifier: MIT
#
# 用法：在本文件所在目录执行
#   docker compose -f docker-compose.deploy.yml up -d
#
# 浏览器访问 http://NAS_IP:8567
# 默认账号：admin   默认密码：123456

services:
  kaycftunnle:
    image: ghcr.io/kaynai1/kaycftunnle:latest
    container_name: kaycftunnle
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8567
      # 可选：预置授权服务地址；不填则首次打开面板时手动输入
      # - KAY_LICENSE_URL=https://kay-license.<你的子域>.workers.dev
      # 断网离线宽限天数，默认 7
      # - KAY_OFFLINE_GRACE_DAYS=7
    ports:
      - "8567:8567"
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8567/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
