# Kay-cftunnle 面板 · 飞牛 fnOS 版 compose
#
# 由飞牛应用中心通过 config/resource 的 docker-project 管理（项目名 kaycftunnle）。
#
# ⚠ 镜像说明（重要）
#   飞牛在【安装阶段】就会直接 docker compose up，不等 cmd/main。
#   所以镜像必须在这之前就存在于 NAS 本地，或者允许联网拉取，否则报：
#       Error response from daemon: No such image: <镜像名>
#
#   镜像名与 pull_policy 由 build-fpk.sh 在打包时直接写入本文件（见下方占位符）。
#   不能依赖 .env：飞牛在【安装阶段】就会 compose up，此时 .env 可能还没生成；
#   升级时还可能是上一次安装残留的旧镜像名。
#   远程镜像由 .github/workflows/docker.yml 在推 main 时多架构构建（amd64 + arm64）。
#
#   想改成离线内嵌包：在项目根执行 sh packaging/fnos/build-fpk.sh（有 docker 时自动内嵌），
#   脚本会把这里的镜像名换成本地镜像并写入 pull_policy: never。

services:
  kaycftunnle:
    image: __KAY_CFTUNNLE_IMAGE__
    container_name: kaycftunnle
    # always（不是 unless-stopped）：开机时由 Docker 自己把面板拉起来。
    # 飞牛的应用自启有时跑在 dockerd 之前，那一次启动会失败而且不重试，
    # 用 always 就不必赌它成功；应用中心里点「停止」仍然会停，只是重启后自启。
    restart: always
    # 容器内需要拉起 cloudflared 子进程并管理隧道，init 负责收信号与回收僵尸进程
    init: true
    pull_policy: __KAY_CFTUNNLE_PULL_POLICY__
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8567
      # 授权服务地址（卖家自己的 Worker 域名）：打包时用 --license-url 写死，买家就不用填
      # 只用离线授权码（KAYO-…）且从没填过地址的买家，面板不会报到，也就无法远程吊销
__KAY_LICENSE_ENV__
      # 断网离线宽限天数，默认 7
      # - KAY_OFFLINE_GRACE_DAYS=7
    ports:
      - "${KAY_CFTUNNLE_PORT:-8567}:8567"
    volumes:
      - "${KAY_CFTUNNLE_DATA:-/vol1/@appdata/kaycftunnle}/data:/app/data"
      - "${KAY_CFTUNNLE_DATA:-/vol1/@appdata/kaycftunnle}/runtime:/app/runtime"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8567/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        # 防止 cloudflared 输出把 NAS 磁盘写满
        max-size: "10m"
        max-file: "3"
