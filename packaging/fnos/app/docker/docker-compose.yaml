# Kay-cftunnle 面板 · 飞牛 fnOS 版 compose
#
# 由飞牛应用中心通过 config/resource 的 docker-project 管理（项目名 kaycftunnle）。
#
# ⚠ 镜像说明（重要）
#   飞牛在【安装阶段】就会直接 docker compose up，不等 cmd/main。
#   所以镜像必须在这之前就存在于 NAS 本地，否则报：
#       Error response from daemon: No such image: <镜像名>
#
#   本包默认使用本地镜像 kaycftunnle:latest（与项目根 build.sh 默认名一致）。
#   两种让镜像就位的办法：
#     1) 在 NAS 上构建：  sudo sh build-on-nas.sh
#     2) 从 GHCR 拉取：   把 .env 里的 KAY_CFTUNNLE_IMAGE 改成
#                         ghcr.io/<你的用户名>/kaycftunnle:latest
#                         （由 .github/workflows/docker.yml 自动构建）
#
#   pull_policy 通过 KAY_CFTUNNLE_PULL_POLICY 控制：
#     never（默认，本地镜像） / always（GHCR 远程镜像） / missing

services:
  kaycftunnle:
    image: ${KAY_CFTUNNLE_IMAGE:-kaycftunnle:latest}
    container_name: kaycftunnle
    restart: unless-stopped
    # 容器内需要拉起 cloudflared 子进程并管理隧道，init 负责收信号与回收僵尸进程
    init: true
    pull_policy: ${KAY_CFTUNNLE_PULL_POLICY:-never}
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
    ports:
      - "${KAY_CFTUNNLE_PORT:-8000}:8000"
    volumes:
      - "${KAY_CFTUNNLE_DATA:-/vol1/@appdata/kaycftunnle}/data:/app/data"
      - "${KAY_CFTUNNLE_DATA:-/vol1/@appdata/kaycftunnle}/runtime:/app/runtime"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        # 防止 cloudflared 输出把 NAS 磁盘写满
        max-size: "10m"
        max-file: "3"
