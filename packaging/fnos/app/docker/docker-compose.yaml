# Kay-cftunnle 面板 · 飞牛 fnOS 版 compose
#
# 由飞牛应用中心通过 config/resource 的 docker-project 管理（项目名 kaycftunnle）。
#
# ⚠ 镜像说明（重要）
#   飞牛在【安装阶段】就会直接 docker compose up，不等 cmd/main。
#   所以镜像必须在这之前就存在于 NAS 本地，或者允许联网拉取，否则报：
#       Error response from daemon: No such image: <镜像名>
#
#   本包默认走 GHCR 远程镜像（build-fpk.sh --image ghcr.io/kaynai1/kaycftunnle:latest）：
#   env.default 里同时写好镜像名与 KAY_CFTUNNLE_PULL_POLICY=always，
#   装包时由 compose 自动从 ghcr.io 拉取，NAS 上不需要预先构建。
#   镜像由 .github/workflows/docker.yml 在推 main 时多架构构建（amd64 + arm64）。
#
#   想改成离线内嵌包：在项目根执行 sh packaging/fnos/build-fpk.sh（有 docker 时自动内嵌），
#   并把 env.default 里的 pull_policy 改回 never。
#
#   pull_policy 通过 KAY_CFTUNNLE_PULL_POLICY 控制：
#     never（本地镜像） / always（远程仓库，安装时拉取） / missing

services:
  kaycftunnle:
    image: ${KAY_CFTUNNLE_IMAGE:-kaycftunnle:latest}
    container_name: kaycftunnle
    restart: unless-stopped
    # 容器内需要拉起 cloudflared 子进程并管理隧道，init 负责收信号与回收僵尸进程
    init: true
    pull_policy: ${KAY_CFTUNNLE_PULL_POLICY:-never}
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8567
    ports:
      - "${KAY_CFTUNNLE_PORT:-8567}:8567"
    volumes:
      - "${KAY_CFTUNNLE_DATA:-/vol1/@appdata/kaycftunnle}/data:/app/data"
      - "${KAY_CFTUNNLE_DATA:-/vol1/@appdata/kaycftunnle}/runtime:/app/runtime"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8567/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        # 防止 cloudflared 输出把 NAS 磁盘写满
        max-size: "10m"
        max-file: "3"
